project:
  type: website
  resources:
    - gv-stats.js

execute:
  freeze: auto

website:
  google-analytics: "G-MCXB7DZFKF"
  favicon: /img/favicon.ico
  title: "golemverse"
  search:
    location: navbar
    type: textbox
  site-url: https://www.golemverse.org
  description: "Welcome to the golemverse!"
  repo-url: https://github.com/ThinkR-open/golemverse.org
  repo-actions: [edit, issue]
  twitter-card: true
  navbar:
    logo: /img/golem.png
    logo-alt: "golem hex sticker"
    left:
      - text: "Packages"
        file: packages/index.qmd
      - text: "Resources"
        file: resources/index.qmd
      - text: "Roadmap"
        file: roadmap/index.qmd
      - text: "News"
        file: news/index.qmd
      # - text: "Stream"
      #   file: stream/index.qmd
      - text: "Contact"
        file: index.qmd#contact
    right:
      - icon: github
        href: https://github.com/topics/golemverse
      - icon: twitter
        href: https://twitter.com/thinkr_fr
      - icon: rss
        href: index.xml
  page-footer:
    left:
      - text: "Website built with Quarto"
        href: https://quarto.org
    center:
      - text: "© ThinkR - A French company of R experts"
        href: https://rtask.thinkr.fr
    right:
      - icon: github
        href: https://github.com/thinkr-open
      - icon: twitter
        href: https://twitter.com/thinkr_fr

format:
  html:
    theme: custom.scss
    css: styles.css
    highlight-style: nord
    include-after-body:
      text: |
        <script src="/gv-stats.js"></script>



